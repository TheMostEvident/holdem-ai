name: Temporary single-package refactor

on:
  push:
    branches:
      - refactor/consolidate-single-holdem-ai-package

permissions:
  contents: write

jobs:
  migrate-test-and-commit:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Apply functional-package migration
        run: python .github/scripts/refactor_packages.py
      - name: Install environment and dependencies
        run: |
          uv sync --python 3.11 --extra dev
          uv pip install --python .venv/bin/python --index https://download.pytorch.org/whl/cpu 'torch==2.6.0'
      - name: Direct imports and checkpoint module paths
        run: |
          .venv/bin/python - <<'PY'
          from holdem_ai.core.schema import InformationState
          from holdem_ai.environment.hunl200_adapter import HUNL200Adapter
          from holdem_ai.encoding.observation import encode_actor
          from holdem_ai.models.transformer import TransformerActor, CentralizedQCritic
          from holdem_ai.training.ppo import PPOConfig
          from holdem_ai.training.qboost import QBoostConfig
          from holdem_ai.experiments.longrun import LongRunConfig
          from holdem_ai.evaluation.opponent_pool import evaluate_opponent_pool
          print('ALL_IMPORTS_PASS')
          PY
      - name: Full regression
        run: .venv/bin/python -m pytest -q
      - name: Basic hand-engine smoke
        run: .venv/bin/python main.py --hands 5 --seed 42
      - name: Commit tested files to refactor branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ scripts/ tests/
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "refactor: consolidate Phase 5-16 into holdem_ai [skip ci]"
          git push origin HEAD:refactor/consolidate-single-holdem-ai-package
