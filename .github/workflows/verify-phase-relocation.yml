name: Temporary relocation verification

on:
  push:
    branches:
      - refactor/move-phase5-16-under-src

jobs:
  import-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install project and developer dependencies
        run: uv sync --python 3.11 --extra dev
      - name: Install PyTorch CPU for GPU-optional test modules
        run: uv pip install --python .venv/bin/python --index https://download.pytorch.org/whl/cpu 'torch==2.6.0'
      - name: Import all moved phase packages
        run: |
          .venv/bin/python - <<'PY'
          import importlib
          for i in range(5, 17):
              p = f"holdem_agent_phase{i}"
              m = importlib.import_module(p)
              print(f"PASS: {p} -> {m.__file__}")
          PY
      - name: Run complete pytest suite
        run: .venv/bin/python -m pytest -q
      - name: Run HUNL smoke test
        run: .venv/bin/python main.py --hands 5 --seed 42
