[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holdem-ai"
version = "0.1.0"
description = "No-Limit Hold'em simulation and reinforcement learning platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rlcard==1.2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = [
    "torch==2.6.0 ; python_full_version < '3.14' and sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
